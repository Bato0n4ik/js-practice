<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'">
    <title>FormData</title>

    <link rel="stylesheet" href="css/ajax-practice-css/form-styles.css">
    <script src="js/ajax-practice/third-client.js" defer></script>
</head>

<body>
    <div id="form-wrapper" class="form-wrapper">
        <form id="form-data" method="post" class="form-field">
            <label for="name" class="label-style">Name:
                <input id="name" name="name" type="text"/>
            </label>
            <label for="age" class="label-style">Age:
                <input id="age" name="age" type="text"/>
            </label>
            <button type="submit">Send</button>
        </form>
    </div>
</body>
</html>
